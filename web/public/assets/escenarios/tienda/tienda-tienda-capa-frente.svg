<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" class="esc e_tienda" data-state="tienda" role="img" width="1280" height="720" xmlns="http://www.w3.org/2000/svg"><title>Tienda y Arsenal — Tienda · Capa frente</title><style>
.esc .e_soft{stroke:#241F5C;stroke-opacity:.5;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.esc .e_ink{stroke:#14123B;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.esc .e_mote{animation:e_rise var(--d,9s) linear var(--dl,0s) infinite;opacity:0}
.esc .e_bob{animation:e_bob var(--d,6s) ease-in-out var(--dl,0s) infinite}
.esc .e_breathe{animation:e_breathe var(--d,5s) ease-in-out var(--dl,0s) infinite}
.esc .e_sway{transform-box:fill-box;transform-origin:50% 0;animation:e_sway var(--d,6s) ease-in-out var(--dl,0s) infinite}
.esc .e_pulse{animation:e_pulse var(--d,3.2s) ease-in-out var(--dl,0s) infinite}
.esc .e_twinkle{animation:e_twinkle var(--d,4s) ease-in-out var(--dl,0s) infinite}
.esc .e_spin{transform-box:view-box;animation:e_spin var(--d,40s) linear infinite}
.esc .e_flick{transform-box:fill-box;transform-origin:50% 100%;animation:e_flick var(--d,3s) ease-in-out var(--dl,0s) infinite}
@keyframes e_rise{0%{transform:translate(0,0);opacity:0}15%{opacity:var(--o,.85)}80%{opacity:var(--o,.85)}100%{transform:translate(var(--dx,10px),var(--dy,-160px));opacity:0}}
@keyframes e_bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--b,-8px))}}
@keyframes e_breathe{0%,100%{opacity:var(--lo,.55)}50%{opacity:var(--hi,1)}}
@keyframes e_sway{0%,100%{transform:rotate(calc(var(--a,2.5deg) * -1))}50%{transform:rotate(var(--a,2.5deg))}}
@keyframes e_pulse{0%,100%{opacity:var(--lo,.3)}45%{opacity:1}}
@keyframes e_twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes e_spin{to{transform:rotate(360deg)}}
@keyframes e_flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.08)}60%{transform:scale(1.06,.94)}80%{transform:scale(.97,1.04)}}
.esc .e_hot{cursor:pointer}
.esc .e_hl{opacity:0;transition:opacity .25s;pointer-events:none}
.esc .e_hot:hover .e_hl,.esc .e_hot:focus-visible .e_hl,.esc .e_hot.e_on .e_hl{opacity:1}
.esc .e_hot:focus{outline:none}
@media (prefers-reduced-motion:reduce){.esc *{animation:none!important;transition:none!important}}

.esc .e_slots{pointer-events:none}
.esc .e_slotlbl{font:700 15px "Bricolage Grotesque","Trebuchet MS",sans-serif;fill:#FFFFFF;paint-order:stroke;stroke:#14123B;stroke-width:4px;letter-spacing:.02em}

.e_tienda{--fire:.7;--spot:0;--warm:.18}
.e_tienda[data-state="forja"]{--fire:1;--warm:.45}
.e_tienda[data-state="oferta"]{--spot:1;--fire:.6}
.e_tienda .t_fire{opacity:var(--fire)}
.e_tienda .t_spot{opacity:var(--spot)}
.e_tienda .t_warm{opacity:var(--warm)}
.e_tienda .t_forja,.e_tienda .t_oferta{display:none}
.e_tienda[data-state="forja"] .t_forja,.e_tienda[data-state="oferta"] .t_oferta{display:inline}
.e_tienda[data-state="forja"] .t_flame{animation-duration:1.4s}
</style><defs><linearGradient id="et-wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A27E92"/><stop offset=".5" stop-color="#7A5E84"/><stop offset="1" stop-color="#4E3E6E"/></linearGradient><linearGradient id="et-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E6460"/><stop offset="1" stop-color="#B07C66"/></linearGradient><radialGradient id="et-fire"><stop offset="0" stop-color="#FFE7A0" stop-opacity=".95"/><stop offset=".45" stop-color="#FF9B54" stop-opacity=".6"/><stop offset="1" stop-color="#FF6B6B" stop-opacity="0"/></radialGradient><radialGradient id="et-warm"><stop offset="0" stop-color="#FFB27A" stop-opacity="1"/><stop offset="1" stop-color="#FFB27A" stop-opacity="0"/></radialGradient><radialGradient id="et-cyan"><stop offset="0" stop-color="#B8FFF8" stop-opacity=".9"/><stop offset="1" stop-color="#2EE6D6" stop-opacity="0"/></radialGradient><radialGradient id="et-gold"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient><radialGradient id="et-halo"><stop offset="0" stop-color="#FFE3C8" stop-opacity=".6"/><stop offset="1" stop-color="#FFE3C8" stop-opacity="0"/></radialGradient><linearGradient id="et-spot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".75"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></linearGradient><linearGradient id="et-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9FFFD" stop-opacity=".55"/><stop offset=".5" stop-color="#9FF3EC" stop-opacity=".18"/><stop offset="1" stop-color="#2EE6D6" stop-opacity=".3"/></linearGradient><linearGradient id="et-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B77E62"/><stop offset="1" stop-color="#8A5A4E"/></linearGradient><linearGradient id="et-woodF" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C08A6C"/><stop offset=".6" stop-color="#9A6654"/><stop offset="1" stop-color="#744A48"/></linearGradient><linearGradient id="et-copper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E0A07A"/><stop offset=".6" stop-color="#B66E50"/><stop offset="1" stop-color="#8A4E44"/></linearGradient><clipPath id="et-win"><circle cx="230" cy="130" r="62"/></clipPath></defs><g id="esc_tienda_frente" class="e_layer" data-depth="1"><path d="M-60 -40H1340V34Q1340 46 1328 46H-48Q-60 46 -60 34Z" fill="url(#et-wood)" class="e_ink"/><path d="M-60 46H70Q70 120 -60 150Z" fill="#8A5A4E" class="e_ink"/><path d="M1340 46H1210Q1210 120 1340 150Z" fill="#8A5A4E" class="e_ink"/><path d="M4 602Q-8 666 4 730H108Q120 666 108 602Z" fill="url(#et-woodF)" class="e_ink"/><path d="M-2 694.2H114M-2 637.8H114" stroke="#14123B" stroke-width="3.5"/><ellipse cx="56" cy="602" rx="52" ry="10" fill="#C08A6C" class="e_ink"/><path d="M107 644Q95 692 107 740H193Q205 692 193 644Z" fill="url(#et-woodF)" class="e_ink"/><path d="M101 713.1H199M101 670.9H199" stroke="#14123B" stroke-width="3.5"/><ellipse cx="150" cy="644" rx="43" ry="10" fill="#C08A6C" class="e_ink"/><path d="M30 600l18 -40 14 6 -18 40zM70 604l10 -46 14 3 -10 46z" fill="#E3CC94" class="e_ink"/><path d="M30 600l18 -40 14 6 -18 40z" fill="#F7EBC8"/><rect x="1166" y="560" width="14" height="200" rx="6" fill="#8A5A4E" class="e_ink"/><rect x="1250" y="560" width="14" height="200" rx="6" fill="#8A5A4E" class="e_ink"/><rect x="1150" y="600" width="130" height="14" rx="7" fill="#B77E62" class="e_ink"/><path d="M1196 704V540l10 -18 10 18V704Z" fill="#D9A57E" class="e_ink"/><rect x="1186" y="636" width="40" height="10" rx="5" fill="#8A5A4E" class="e_ink"/><circle cx="1252" cy="668" r="44" fill="#2EE6D6" class="e_ink"/><circle cx="1252" cy="668" r="28" fill="none" stroke="#14123B" stroke-width="3"/><path d="M1252 654Q1255.9 664.1 1266 668Q1255.9 671.9 1252 682Q1248.1 671.9 1238 668Q1248.1 664.1 1252 654Z" fill="#FFC83D"/><g class="t_warm"><ellipse cx="1040" cy="420" rx="560" ry="420" fill="url(#et-warm)"/></g></g></svg>