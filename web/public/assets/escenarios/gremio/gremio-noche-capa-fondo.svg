<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" class="esc e_gremio" data-state="noche" role="img" width="1280" height="720" xmlns="http://www.w3.org/2000/svg"><title>El Gremio — Noche · Capa fondo</title><style>
.esc .e_soft{stroke:#241F5C;stroke-opacity:.5;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.esc .e_ink{stroke:#14123B;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.esc .e_mote{animation:e_rise var(--d,9s) linear var(--dl,0s) infinite;opacity:0}
.esc .e_bob{animation:e_bob var(--d,6s) ease-in-out var(--dl,0s) infinite}
.esc .e_breathe{animation:e_breathe var(--d,5s) ease-in-out var(--dl,0s) infinite}
.esc .e_sway{transform-box:fill-box;transform-origin:50% 0;animation:e_sway var(--d,6s) ease-in-out var(--dl,0s) infinite}
.esc .e_pulse{animation:e_pulse var(--d,3.2s) ease-in-out var(--dl,0s) infinite}
.esc .e_twinkle{animation:e_twinkle var(--d,4s) ease-in-out var(--dl,0s) infinite}
.esc .e_spin{transform-box:view-box;animation:e_spin var(--d,40s) linear infinite}
.esc .e_flick{transform-box:fill-box;transform-origin:50% 100%;animation:e_flick var(--d,3s) ease-in-out var(--dl,0s) infinite}
@keyframes e_rise{0%{transform:translate(0,0);opacity:0}15%{opacity:var(--o,.85)}80%{opacity:var(--o,.85)}100%{transform:translate(var(--dx,10px),var(--dy,-160px));opacity:0}}
@keyframes e_bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--b,-8px))}}
@keyframes e_breathe{0%,100%{opacity:var(--lo,.55)}50%{opacity:var(--hi,1)}}
@keyframes e_sway{0%,100%{transform:rotate(calc(var(--a,2.5deg) * -1))}50%{transform:rotate(var(--a,2.5deg))}}
@keyframes e_pulse{0%,100%{opacity:var(--lo,.3)}45%{opacity:1}}
@keyframes e_twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes e_spin{to{transform:rotate(360deg)}}
@keyframes e_flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.08)}60%{transform:scale(1.06,.94)}80%{transform:scale(.97,1.04)}}
.esc .e_hot{cursor:pointer}
.esc .e_hl{opacity:0;transition:opacity .25s;pointer-events:none}
.esc .e_hot:hover .e_hl,.esc .e_hot:focus-visible .e_hl,.esc .e_hot.e_on .e_hl{opacity:1}
.esc .e_hot:focus{outline:none}
@media (prefers-reduced-motion:reduce){.esc *{animation:none!important;transition:none!important}}

.esc .e_slots{pointer-events:none}
.esc .e_slotlbl{font:700 15px "Bricolage Grotesque","Trebuchet MS",sans-serif;fill:#FFFFFF;paint-order:stroke;stroke:#14123B;stroke-width:4px;letter-spacing:.02em}

