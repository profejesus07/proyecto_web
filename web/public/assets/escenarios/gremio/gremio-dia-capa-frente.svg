  --c1:#E2C3B4;--c2:#B98F93;--c3:#7C6286;--c4:#6A5582;--cap1:#D9B8AA;--cap2:#C29E99;--cap3:#9C7C92;--bA:#FFD978;--bAo:.55;--bB:#9FF3EC;--bBo:.14;--halo:#FFEBC2;--haloO:.5;--tch:.7;--glass:.9;--star:.35}
.e_gremio[data-state="noche"]{--sk1:#0E0C2B;--sk2:#2E2775;--w1:#6A62A0;--w2:#4C4486;--w3:#2F2864;--fl1:#655CA0;--fl2:#4A4288;--fl3:#2F2866;--pil:#8D85C4;
  --c1:#A79FD6;--c2:#7D75B6;--c3:#544C92;--c4:#433C80;--cap1:#ABA3D9;--cap2:#8F87C6;--cap3:#6C64A6;--bA:#FFD978;--bAo:.12;--bB:#7FF2E8;--bBo:.4;--halo:#B4F7F1;--haloO:.5;--tch:1;--glass:1;--star:1}
.e_gremio .g_star{opacity:var(--star)}
.e_gremio .g_beamA{opacity:var(--bAo)}
.e_gremio .g_beamB{opacity:var(--bBo)}
.e_gremio .g_halo{opacity:var(--haloO)}
.e_gremio .g_tch{opacity:var(--tch)}
.e_gremio .g_glass{opacity:var(--glass)}
.e_gremio .g_ring{transform-box:fill-box;transform-origin:center}
