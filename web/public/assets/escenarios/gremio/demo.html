<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Gremio · parallax</title><style>body{margin:0;background:#0F0D2E;font:15px system-ui,sans-serif;color:#F4F2FF}p{padding:12px 16px;margin:0}.escena{position:relative;aspect-ratio:16/9;overflow:hidden;max-width:1280px;margin:auto}.capa{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;transform:translate(calc(var(--px,0) * var(--d) * 14px),calc(var(--py,0) * var(--d) * 8px));transition:transform .25s ease-out}@media (max-width:600px){.escena{aspect-ratio:9/16}}@media (prefers-reduced-motion:reduce){.capa{transform:none;transition:none}}</style><p>El Gremio · mueve el puntero (o inclina el móvil) para ver la profundidad.</p><div class="escena" id="esc">

</div><script>const e=document.getElementById("esc");function m(x,y){e.style.setProperty("--px",x);e.style.setProperty("--py",y)}e.addEventListener("pointermove",v=>{const r=e.getBoundingClientRect();m(-((v.clientX-r.left)/r.width-.5)*2,-((v.clientY-r.top)/r.height-.5)*2)});e.addEventListener("pointerleave",()=>m(0,0));addEventListener("deviceorientation",v=>{if(v.gamma!=null)m(-Math.max(-1,Math.min(1,v.gamma/30)),-Math.max(-1,Math.min(1,((v.beta||45)-45)/30)))});</script>
