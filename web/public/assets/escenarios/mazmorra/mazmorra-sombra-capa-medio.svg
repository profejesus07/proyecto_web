<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" class="esc e_mazmorra" data-state="sombra" role="img" width="1280" height="720" xmlns="http://www.w3.org/2000/svg"><title>Mazmorra — Sombra · Capa medio</title><style>
.esc .e_soft{stroke:#241F5C;stroke-opacity:.5;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.esc .e_ink{stroke:#14123B;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
