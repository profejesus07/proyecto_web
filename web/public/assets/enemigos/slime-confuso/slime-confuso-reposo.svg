<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 20 290 404" role="img" class="cc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="290" height="404"><style>.cc{--display:"Baloo 2","Trebuchet MS",sans-serif;--body:system-ui,sans-serif}
.cc .ol{stroke: rgb(14, 12, 43); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round;}
.cc .ol2{stroke: rgb(14, 12, 43); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}
.cc .q{font: 700 34px var(--display);}
.cc .foehit{cursor: pointer;}
.cc .foehit:focus-visible{outline: none;}
.cc .foe,.cc .foe *{transform-box: fill-box;}
.cc .foe .appear-g,.cc .foe .body-g{transform-origin: 50% 100%;}
.cc .fx,.cc .poof,.cc .hitfx,.cc .mouth-o{opacity: 0; transition: opacity 0.15s;}
.cc .mouth-c{transition: opacity 0.15s;}
.cc #x-slime .body-g{animation: 1.6s ease-in-out 0s infinite normal none running x_wobble;}
.cc #x-slime .spiral{transform-origin: 50% 50%; animation: 3s linear 0s infinite normal none running x_spin;}
.cc #x-slime .s2{animation-direction: reverse;}
.cc .impact,.cc .speed,.cc .dust,.cc .dring{opacity: 0;}
.cc .bub{animation: 3s ease-in 0s infinite normal none running x_bubble;}
.cc .b2{animation-delay: 1.4s;}
.cc .drip{animation: 2.6s ease-in 0s infinite normal none running x_drip;}
@media (prefers-reduced-motion: reduce){.cc .foe,.cc .foe *{animation: auto ease 0s 1 normal none running none !important;}}
@keyframes x_wobble { 
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(1.05, 0.95); }
}
@keyframes x_spin { 
  100% { transform: rotate(360deg); }
}
@keyframes x_bubble { 
  0% { opacity: 0; transform: translateY(0px); }
  20% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(-50px); }
}
@keyframes x_drip { 
  0%, 40% { opacity: 0; transform: translateY(-6px) scale(0.6); }
  55% { opacity: 1; transform: translateY(0px) scale(1); }
  100% { opacity: 0; transform: translateY(16px) scale(0.8, 1.2); }
}</style>
<title>Slime Confuso</title>


