@keyframes cxena3_1{0%{transform:scale(0.2);animation-timing-function:linear}0.004%{transform:scale(0.2);animation-timing-function:ease-out}16.671%{transform:scale(1.3);animation-timing-function:ease-out}33.338%{transform:scale(1);animation-timing-function:linear}100%{transform:scale(1);animation-timing-function:linear}}
.cc [data-ai="a3"]{animation:cxena3_0 1200ms linear infinite,cxena3_1 1200ms linear infinite!important}</style>
