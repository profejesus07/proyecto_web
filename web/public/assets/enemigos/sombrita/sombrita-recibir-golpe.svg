@keyframes cxena0_2{0%{filter:none;animation-timing-function:linear}0.004%{filter:none;animation-timing-function:ease-out}5.004%{filter:brightness(2.4) saturate(0.2);animation-timing-function:ease-out}14.588%{filter:none;animation-timing-function:ease-out}41.671%{filter:none;animation-timing-function:linear}100%{filter:none;animation-timing-function:linear}}
.cc [data-ai="a0"]{animation:cxena0_0 1200ms linear infinite,cxena0_1 1200ms linear infinite,cxena0_2 1200ms linear infinite!important}
