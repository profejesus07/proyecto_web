<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="580 20 290 404" role="img" class="cc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="290" height="404"><style>.cc{--display:"Baloo 2","Trebuchet MS",sans-serif;--body:system-ui,sans-serif}
.cc .ol{stroke: rgb(14, 12, 43); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round;}
.cc .foehit{cursor: pointer;}
.cc .foehit:focus-visible{outline: none;}
.cc .foe,.cc .foe *{transform-box: fill-box;}
.cc .foe .appear-g,.cc .foe .body-g{transform-origin: 50% 100%;}
.cc .fx,.cc .poof,.cc .hitfx,.cc .mouth-o{opacity: 0; transition: opacity 0.15s;}
.cc .mouth-c{transition: opacity 0.15s;}
.cc .foe[data-act="hit"] .hitfx{opacity: 1;}
.cc .foe[data-act="hit"] .hitfx path{animation: 0.4s ease-out 0s 1 normal both running x_pop;}
.cc .foe[data-act="hit"] .body-g{animation: 0.5s ease-out 0s 1 normal none running x_hit;}
.cc #x-sombra .body-g{animation: 2.4s ease-in-out 0s infinite normal none running x_hover;}
.cc #x-sombra .s-tail{transform-origin: 50% 0%; animation: 0.5s ease-in-out 0s infinite alternate none running x_flick;}
.cc #x-sombra .s-eyes{transform-origin: 50% 50%; animation: 1.6s ease-in-out 0s infinite normal none running x_glow;}
.cc #x-sombra[data-act="hit"] .body-g{animation: 0.5s steps(2) 0s 1 normal none running x_flicker, 0.5s ease-out 0s 1 normal none running x_hit;}
.cc .impact,.cc .speed,.cc .dust,.cc .dring{opacity: 0;}
.cc .foe[data-act="hit"] .body-g{animation: 0.5s ease-out 0s 1 normal none running x_hit, 0.5s ease-out 0s 1 normal none running x_hitflash !important;}
.cc #x-sombra[data-act="hit"] .body-g{animation: 0.5s steps(2) 0s 1 normal none running x_flicker, 0.5s ease-out 0s 1 normal none running x_hit, 0.5s ease-out 0s 1 normal none running x_hitflash !important;}
.cc .wisps circle{animation: 2.2s ease-out 0s infinite normal none running x_wisp;}
.cc .wisps circle:nth-child(2){animation-delay: 0.7s;}
.cc .wisps circle:nth-child(3){animation-delay: 1.4s;}
@media (prefers-reduced-motion: reduce){.cc .foe,.cc .foe *{animation: auto ease 0s 1 normal none running none !important;}}
@keyframes x_hover { 
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}
@keyframes x_flick { 
  0% { transform: skewX(-8deg); }
  100% { transform: skewX(8deg); }
}
@keyframes x_glow { 
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}
@keyframes x_flicker { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
@keyframes x_hit { 
  0% { transform: translateX(0px); }
  20% { transform: translateX(16px) rotate(4deg); }
  40% { transform: translateX(-8px); }
  60% { transform: translateX(5px); }
  100% { transform: translateX(0px); }
}
@keyframes x_pop { 
  0% { opacity: 0; transform: scale(0.2); }
  50% { opacity: 1; transform: scale(1.3); }
  100% { opacity: 0; transform: scale(1); }
}
@keyframes x_hitflash { 
  0%, 100% { filter: none; }
  12% { filter: brightness(2.4) saturate(0.2); }
  35% { filter: none; }
}
@keyframes x_wisp { 
  0% { opacity: 0.8; transform: translateY(0px) scale(0.6); }
  100% { opacity: 0; transform: translateY(-30px) scale(1.4); }
}
