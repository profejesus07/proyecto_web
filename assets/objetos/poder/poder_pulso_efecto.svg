<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" class="pe" id="poder_pulso_efecto" role="img" aria-label="Efecto: Pulso de Memoria"><title>Pulso de Memoria · efecto de activación</title><style>
.pe{--it:infinite}
.pe *{transform-box:view-box}
.pe .a{animation-duration:1.8s;animation-iteration-count:var(--it);animation-fill-mode:both;animation-timing-function:ease-out}
@media (prefers-reduced-motion:reduce){.pe *{animation:none!important}}
@keyframes tw{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
.pe .sp{animation-name:tw}
.pe .wv{transform-origin:320px 230px;animation-name:wv}
.pe .card{animation-name:card}
.pe .q{animation-name:q}.pe .ex{animation-name:ex}
@keyframes wv{0%{opacity:0;transform:scale(.1)}15%{opacity:.95}100%{opacity:0;transform:scale(1.8)}}
@keyframes card{0%,20%{opacity:0;transform:translateY(10px)}35%,85%{opacity:1;transform:none}100%{opacity:0}}
@keyframes q{0%,45%{opacity:1}55%,100%{opacity:0}}
