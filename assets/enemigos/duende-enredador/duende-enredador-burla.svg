<svg viewBox="290 20 290 404" role="img" class="cc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="290" height="404"><style>.cc{--display:"Baloo 2","Trebuchet MS",sans-serif;--body:system-ui,sans-serif}
.cc .ol{stroke: rgb(14, 12, 43); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round;}
.cc .ol2{stroke: rgb(14, 12, 43); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}
.cc .foehit{cursor: pointer;}
.cc .foehit:focus-visible{outline: none;}
.cc .foe,.cc .foe *{transform-box: fill-box;}
.cc .foe .appear-g,.cc .foe .body-g{transform-origin: 50% 100%;}
.cc .fx,.cc .poof,.cc .hitfx,.cc .mouth-o{opacity: 0; transition: opacity 0.15s;}
.cc .foe[data-act="taunt"] .mouth-o{opacity: 1;}
.cc .foe[data-act="taunt"] .mouth-c{opacity: 0;}
.cc .mouth-c{transition: opacity 0.15s;}
.cc #x-duende .body-g{animation: 2.6s ease-in-out 0s infinite normal none running x_sneak;}
.cc #x-duende .rope{transform-origin: 20% 30%; animation: 1.8s ease-in-out 0s infinite normal none running x_swirl;}
.cc #x-duende[data-act="taunt"] .d-head{transform-origin: 50% 100%; animation: 0.3s ease-in-out 0s 6 alternate none running x_waggle;}
.cc #x-duende[data-act="taunt"] .d-arm-l{transform-origin: 100% 0%; animation: 0.2s ease-in-out 0s 8 alternate none running x_waggle;}
.cc .impact,.cc .speed,.cc .dust,.cc .dring{opacity: 0;}
.cc .pupils{animation: 4s ease-in-out 0s infinite normal none running x_glance;}
.cc .earL{transform-origin: 100% 60%; animation: 3.4s ease-in-out 0s infinite normal none running x_earw;}
.cc .earR{transform-origin: 0% 60%; animation: 3.4s ease-in-out -1.2s infinite normal none running x_earw2;}
@media (prefers-reduced-motion: reduce){.cc .foe,.cc .foe *{animation: auto ease 0s 1 normal none running none !important;}}
@keyframes x_sneak { 
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-4px) rotate(-2deg); }
}
@keyframes x_swirl { 
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-14deg); }
}
@keyframes x_waggle { 
  0% { transform: rotate(-6deg); }
  100% { transform: rotate(6deg); }
}
@keyframes x_glance { 
  0%, 30%, 100% { transform: translateX(0px); }
  40%, 55% { transform: translateX(-3px); }
  65%, 80% { transform: translateX(3px); }
}
@keyframes x_earw { 
  0%, 80%, 100% { transform: rotate(0deg); }
  86% { transform: rotate(-6deg); }
  92% { transform: rotate(3deg); }
}
@keyframes x_earw2 { 
  0%, 80%, 100% { transform: rotate(0deg); }
  86% { transform: rotate(6deg); }
  92% { transform: rotate(-3deg); }
}
