<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="870 20 290 404" role="img" class="cc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="290" height="404"><style>.cc{--display:"Baloo 2","Trebuchet MS",sans-serif;--body:system-ui,sans-serif}
.cc .ol{stroke: rgb(14, 12, 43); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round;}
.cc .ol2{stroke: rgb(14, 12, 43); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}
.cc .foehit{cursor: pointer;}
.cc .foehit:focus-visible{outline: none;}
.cc .foe,.cc .foe *{transform-box: fill-box;}
.cc .foe .appear-g,.cc .foe .body-g{transform-origin: 50% 100%;}
.cc .fx,.cc .poof,.cc .hitfx{opacity: 0; transition: opacity 0.15s;}
.cc #x-cofre .c-lid{transform-origin: 50% 100%; animation: 3s ease-in-out 0s infinite normal none running x_peek;}
.cc #x-cofre .c-mouth{transform-origin: 50% 0%;}
.cc #x-cofre[data-act="taunt"] .c-lid{animation: auto ease 0s 1 normal none running none; transform: translateY(-26px) rotate(-4deg);}
.cc #x-cofre[data-act="taunt"] .tongue{transform-origin: 50% 0%; animation: 0.2s ease-in-out 0s 8 alternate none running x_tongue;}
.cc .impact,.cc .speed,.cc .dust,.cc .dring{opacity: 0;}
.cc .glint{transform-origin: 50% 50%; animation: 3.6s ease-in-out 0s infinite normal none running x_glint;}
@media (prefers-reduced-motion: reduce){.cc .foe,.cc .foe *{animation: auto ease 0s 1 normal none running none !important;}}
@keyframes x_peek { 
  0%, 80%, 100% { transform: translateY(0px); }
  86%, 94% { transform: translateY(-8px) rotate(-2deg); }
}
@keyframes x_tongue { 
  0% { transform: scaleY(1); }
  100% { transform: scaleY(1.4) rotate(6deg); }
}
@keyframes x_glint { 
  0%, 70%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
  80% { opacity: 1; transform: scale(1.1) rotate(45deg); }
  90% { opacity: 0; transform: scale(0.4) rotate(90deg); }
}
